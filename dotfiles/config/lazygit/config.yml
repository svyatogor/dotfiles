gui:
  nerdFontsVersion: "3"
  # Named ANSI colours only, so they follow the terminal's live theme.
  # Selected-line colours are left to lazygit, which derives them from the
  # terminal background at startup; Rex's contrast correction keeps text legible.
  theme:
    activeBorderColor: [blue, bold]
    # Not [default, dim]: lazygit renders that as ANSI white, invisible on light.
    inactiveBorderColor: [default]
    searchingActiveBorderColor: [magenta, bold]
    optionsTextColor: [blue]
    cherryPickedCommitFgColor: [blue]
    cherryPickedCommitBgColor: [default]
    markedBaseCommitFgColor: [blue]
    markedBaseCommitBgColor: [default]
    unstagedChangesColor: [red]
    defaultFgColor: [default]
    # Authors and the commit graph take this colour. Unset, lazygit hashes the name into a
    # fixed RGB colour made for dark backgrounds (pale yellow on a light theme).
    authorColors:
      "*": magenta
customCommands:
  - key: "C"
    context: "files"
    description: "Generate commit message with Claude Code"
    command: "git diff --staged | claude -p 'Generate a concise git commit message for these staged changes. Output ONLY the raw commit message with no markdown, no code blocks, no backticks, no explanations. Use conventional commit format. Here is some context: {{index .PromptResponses 0}}' --model haiku --output-format text > /tmp/commit_msg && GIT_EDITOR=nvim git  commit -e -F /tmp/commit_msg"
    prompts:
      - type: "input"
        title: "context"
    output: terminal
